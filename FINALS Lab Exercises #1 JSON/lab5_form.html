<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - PHP + JSON + JavaScript (AJAX)</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 480px;
            margin: 60px auto;
            padding: 0 20px;
        }
        h1 {
            font-size: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
        }
        #output {
            margin-top: 20px;
            padding: 12px;
            background: #f4f4f4;
            border-left: 4px solid #ccc;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: Consolas, monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <h1>Lab 5: Send JSON with AJAX</h1>

    <form id="nameForm">
        <label for="nameInput">Name</label>
        <input type="text" id="nameInput" name="name" placeholder="e.g. Maria" autocomplete="off">
        <button type="submit">Send</button>
    </form>

    <div id="output">JSON response will appear here.</div>

    <script>
        const form = document.getElementById('nameForm');
        const nameInput = document.getElementById('nameInput');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            // Stop the form from reloading the page
            event.preventDefault();

            const payload = {
                name: nameInput.value
            };

            fetch('lab5_process.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(function (response) {
                return response.json();
            })
            .then(function (data) {
                // Show the raw JSON response too
                output.textContent =
                    'status: ' + data.status + '\n' +
                    'message: ' + data.message + '\n\n' +
                    JSON.stringify(data);
            })
            .catch(function (error) {
                output.textContent = 'Request failed: ' + error.message;
            });
        });
    </script>

</body>
</html>
